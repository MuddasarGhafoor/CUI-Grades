<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Voice Calculator</title>
<style>
:root{
  --bg:#0a0f1c;--card:#121a2c;--card2:#18223a;--line:#26334f;--line2:#33446a;
  --text:#eef3fb;--muted:#8b9ab5;--accent:#4fd1bd;--accent2:#6ea8fe;
  --ok:#5fd397;--warn:#f2c46d;--err:#ff7b84;--r:16px;
}
*{box-sizing:border-box}
html{scrollbar-width:thin;scrollbar-color:#35496b transparent}
body{margin:0;color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:180px;min-height:100vh;
  background:radial-gradient(900px 420px at 10% -10%,#15405a55,transparent 60%),radial-gradient(700px 380px at 100% 0%,#2b2a6a44,transparent 60%),var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

/* custom scrollbars */
::-webkit-scrollbar{width:10px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2f4062;border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--accent);background-clip:padding-box}
.scroll{scrollbar-width:thin;scrollbar-color:#35496b transparent}

.app{max-width:820px;margin:auto;padding:24px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px #4fd1bd33}
h1{font-size:23px;margin:0;letter-spacing:-.03em;line-height:1.2}
.top p{margin:0;color:var(--muted);font-size:13px}

.btn{border:1px solid var(--line2);background:var(--card2);padding:8px 14px;border-radius:11px;font-weight:600;font-size:14px;transition:.15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#4aa9d8);color:#05211d;border-color:transparent}
.btn.danger{color:var(--err)}
.btn.danger:hover{border-color:var(--err)}
.btn.danger-solid{background:var(--err);color:#2a0609;border-color:var(--err)}
.btn.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:16px}

/* tabs */
.tabs{display:flex;gap:4px;background:#0e1527;border:1px solid var(--line);padding:4px;border-radius:15px;margin-bottom:18px}
.tab{flex:1;border:0;background:none;padding:10px 6px;border-radius:11px;color:var(--muted);font-weight:650;transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px}
.tab:hover{color:var(--text)}
.tab.on{background:var(--card2);color:var(--text);box-shadow:0 0 0 1px var(--line2),0 6px 16px #0005}
.panel{display:none}.panel.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

.card{background:linear-gradient(180deg,#141d31,#111829);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0;font-size:15px}
.muted{color:var(--muted);font-size:13px}

input[type=text],input[type=number]{width:100%;background:#0c1322;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;outline:none;min-width:0;transition:.15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4fd1bd22}
input[type=number]{font-variant-numeric:tabular-nums;text-align:center}
input[type=number]::-webkit-inner-spin-button{opacity:.3}
label.l{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.07em}

/* custom dropdown */
.dd{position:relative;min-width:0}
.dd-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0c1322;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;text-align:left;transition:.15s}
.dd-btn:hover,.dd.open .dd-btn{border-color:var(--accent)}
.dd-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn i{font-style:normal;color:var(--muted);font-size:11px;transition:.15s}
.dd.open .dd-btn i{transform:rotate(180deg)}
.dd-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:80;max-height:230px;overflow:auto;background:#0f182b;border:1px solid #3d4f78;border-radius:12px;padding:5px;box-shadow:0 18px 40px #000b;scrollbar-width:thin;scrollbar-color:#3b5078 transparent;min-width:120px}
.dd.open .dd-menu{display:block;animation:fade .15s}
.dd.up .dd-menu{top:auto;bottom:calc(100% + 6px)}
.dd-item{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px}
.dd-item:hover{background:#1d2b47}
.dd-item.on{background:#16403f;color:#aaf1e6}

/* course chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.chip{flex:none;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;transition:.15s}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip.on{background:linear-gradient(135deg,#17504d,#1b3f6e);color:#fff;border-color:#3fa8a0}
.chip.add{border-style:dashed;color:var(--accent);background:none}
.chip.add:hover{border-color:var(--accent)}

/* course head */
.head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.name-in{font-size:19px;font-weight:750;background:transparent!important;border:1px solid transparent!important;padding:5px 8px!important;margin-left:-8px;letter-spacing:-.02em;text-align:left!important}
.name-in:hover{border-color:var(--line2)!important}
.name-in:focus{background:#0c1322!important;border-color:var(--accent)!important}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ring{position:relative;width:112px;height:112px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:#223050}
.ring .arc{stroke:var(--accent);transition:stroke-dasharray .45s ease,stroke .3s}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .mid b{font-size:21px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring .mid span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:12px;color:var(--muted)}
.pill b{color:var(--text);font-size:15px;margin-left:5px;font-variant-numeric:tabular-nums}

.seg{display:inline-flex;background:#0e1527;border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;color:var(--muted);padding:7px 20px;border-radius:9px;font-weight:650;transition:.15s}
.seg button.on{background:var(--accent);color:#05211d}

.cat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.cat-title{display:flex;align-items:center;gap:10px}
.cat-ico{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:17px}
.tag{font-size:11px;background:#19383b;color:#a5ece0;border-radius:99px;padding:2px 8px;margin-left:7px;font-weight:600;vertical-align:1px}
.score{font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent2);font-size:16px}
.meter{height:4px;background:#223050;border-radius:9px;margin-bottom:12px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s}
.row{display:grid;grid-template-columns:22px 1fr 14px 1fr 34px;gap:8px;align-items:center;margin-bottom:7px}
.row.single{grid-template-columns:1fr 14px 1fr}
.row .idx{color:var(--muted);font-size:12px;text-align:center}
.row .sl{text-align:center;color:var(--muted)}
.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;height:36px;transition:.15s}
.x:hover{color:var(--err);border-color:var(--err)}
.add{width:100%;background:none;border:1px dashed #3d4f78;color:var(--muted);padding:8px;border-radius:10px;font-weight:600;transition:.15s}
.add:hover{color:var(--accent);border-color:var(--accent);background:#4fd1bd0d}
.flash{animation:flash 1s}
@keyframes flash{0%{background:#4fd1bd33}100%{background:transparent}}

.empty{text-align:center;padding:38px 18px}
.empty .big{font-size:44px;margin-bottom:6px}
.empty h3{font-size:19px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:420px}

/* results */
.hero{display:grid;grid-template-columns:1fr 1px 1fr;gap:16px;align-items:center;padding:22px;margin-bottom:12px;border-radius:var(--r);border:1px solid #2f5a6e;background:linear-gradient(135deg,#12384a,#1b2a5a)}
.hero .vr{background:#ffffff22;align-self:stretch}
.hero div{text-align:center}
.hero span{font-size:11px;color:#b6cde0;text-transform:uppercase;letter-spacing:.1em}
.hero b{display:block;font-size:46px;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.hero small{color:#9fb8cc;font-size:12px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
.metric span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.metric b{font-size:22px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td.num{font-variant-numeric:tabular-nums}
.bar-mini{height:4px;background:#223050;border-radius:9px;margin-top:5px;overflow:hidden;max-width:220px}
.bar-mini i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.gtag{display:inline-block;min-width:44px;text-align:center;border-radius:8px;padding:2px 8px;font-weight:700;background:#1a2a48}

/* grade scale */
.grow{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;margin-bottom:7px;align-items:center}

/* voice dock */
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(792px,calc(100% - 24px));background:#0f1729f0;backdrop-filter:blur(14px);border:1px solid #3a4d78;border-radius:22px;padding:12px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 56px #000b;z-index:20}
.dock.hide{display:none}
.mic{flex:none;width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04221e;font-size:25px;position:relative;transition:.2s}
.mic:hover{transform:scale(1.06)}
.mic.live{background:linear-gradient(135deg,#ff7b84,#f2a56d);animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff7b8466}100%{box-shadow:0 0 0 20px #ff7b8400}}
.dmid{flex:1;min-width:0}
.dstat{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dstat b{color:var(--text)}
.wave{display:none;gap:2px;align-items:center;height:14px}
.wave.on{display:flex}
.wave i{width:3px;background:var(--err);border-radius:3px;animation:wv 0.9s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:3px}50%{height:14px}}
.heard{font-size:14px;min-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent)}
.heard.interim{color:var(--muted);font-style:italic}
.typer{display:flex;gap:6px;margin-top:5px}
.typer input{text-align:left;padding:7px 11px;font-size:13px}
.typer .btn{padding:6px 12px}
.dside{display:flex;flex-direction:column;gap:6px;width:118px;flex:none}
.dside .btn{padding:6px 8px;font-size:12px}
.dside .dd-btn{padding:6px 9px;font-size:12px}

/* toasts */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;width:min(430px,calc(100% - 24px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;background:#15213a;border:1px solid #3d4f78;border-left:4px solid var(--accent2);padding:11px 14px;border-radius:13px;box-shadow:0 12px 34px #000a;animation:tin .22s ease;font-size:14px}
.toast.ok{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--warn)}.toast.err{border-left-color:var(--err)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.25s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}

/* modal */
#modal{display:none;position:fixed;inset:0;z-index:70;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.m-back{position:absolute;inset:0;background:#000b;backdrop-filter:blur(4px)}
.m-box{position:relative;background:#121a2c;border:1px solid #3d4f78;border-radius:20px;padding:22px;width:min(440px,100%);animation:tin .2s;box-shadow:0 30px 80px #000c}
.m-box h3{margin:0 0 6px;font-size:19px}
.m-box p{margin:0 0 14px;color:var(--muted)}
.m-act{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.help li{margin-bottom:8px}
.help code{background:#0c1322;border:1px solid var(--line);padding:2px 8px;border-radius:7px;color:#aaf1e6;font-size:13px}

@media(max-width:600px){
  .app{padding:18px 12px}
  .hero b{font-size:36px}
  .head{grid-template-columns:1fr}
  .ring{position:absolute;right:16px;top:14px;width:84px;height:84px}
  .ring .mid b{font-size:16px}
  .card.course{position:relative}
  .name-in{max-width:calc(100% - 96px)}
  .metrics{grid-template-columns:1fr}
  .dside{display:none}.mic{width:52px;height:52px}
  .row{grid-template-columns:18px 1fr 10px 1fr 32px}
  .tab .tl{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo">🎓</div><div><h1>GPA Calculator</h1><p>Speak your marks, get your GPA &amp; CGPA</p></div></div>
    <button class="btn" id="helpBtn">🎙 Voice help</button>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab on" data-tab="courses" role="tab">📚 <span class="tl">Courses</span></button>
    <button class="tab" data-tab="results" role="tab">📈 <span class="tl">GPA &amp; CGPA</span></button>
    <button class="tab" data-tab="scale" role="tab">⚙️ <span class="tl">Grade scale</span></button>
  </nav>

  <section class="panel on" id="tab-courses"><div id="coursesView"></div></section>
  <section class="panel" id="tab-results"><div id="resultsView"></div></section>
  <section class="panel" id="tab-scale"><div id="scaleView"></div></section>
</div>

<div class="dock" id="dock">
  <button class="mic" id="mic" aria-label="Start or stop voice input">🎤</button>
  <div class="dmid">
    <div class="dstat"><span class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></span><span id="dstat"></span></div>
    <div class="heard" id="heard"></div>
    <form class="typer" id="typer"><input type="text" id="cmd" placeholder="Or type a command, e.g. midterm 20 of 25" autocomplete="off"><button class="btn" type="submit">Go</button></form>
  </div>
  <div class="dside"><div id="langDD"></div><button class="btn" id="undoBtn">↶ Undo</button></div>
</div>

<div id="toasts"></div>
<div id="modal"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='gpa-calc-v3';
const DEFAULT_GRADES=[[85,4],[80,3.66],[75,3.33],[70,3],[65,2.66],[60,2.33],[55,2],[50,1],[0,0]];
// [key,label,weight,defaultTotal,isList,icon,singular]
const THEORY=[['assignments','Assignments',10,10,1,'📝','assignment'],['quizzes','Quizzes',15,10,1,'❓','quiz'],['mid','Midterm',25,25,0,'📖','midterm'],['final','Final exam',50,50,0,'🎯','final exam']];
const LAB=[['labAssignments','Lab assignments',25,10,1,'🧪','lab assignment'],['midLab','Lab midterm',25,25,0,'🔬','lab midterm'],['finalLab','Lab final',50,50,0,'🏁','lab final']];
const META={};[...THEORY,...LAB].forEach(m=>META[m[0]]={label:m[1],w:m[2],def:m[3],list:!!m[4],one:m[6]});

/* ---------- state ---------- */
function newCourse(name,tch=3,lch=0){
  return {id:0,name,tch,lch,items:{assignments:[],quizzes:[],labAssignments:[],
    mid:{o:'',t:'25'},final:{o:'',t:'50'},midLab:{o:'',t:'25'},finalLab:{o:'',t:'50'}}};
}
function defaultState(){
  return {courses:[],active:0,subtab:'theory',prevCgpa:'',prevCH:'',grades:DEFAULT_GRADES.map(g=>[...g]),lang:'en-US',nextId:1};
}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!Array.isArray(state.courses))state=defaultState();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const activeCourse=()=>state.courses.find(c=>c.id===state.active)||null;
function createCourse(name,tch=3,lch=0){
  const c=newCourse(name,tch,lch);c.id=state.nextId++;state.courses.push(c);
  state.active=c.id;state.subtab='theory';save();return c;
}

/* ---------- calculation ---------- */
const num=v=>v===''||v==null?null:Number(v);
function listPct(arr){let o=0,t=0;arr.forEach(x=>{const a=num(x.o),b=num(x.t);if(a!=null&&b>0){o+=a;t+=b}});return t>0?100*o/t:null}
function singlePct(x){const a=num(x.o),b=num(x.t);return a!=null&&b>0?100*a/b:null}
function gradeFor(p){
  const g=state.grades.filter(r=>Number.isFinite(+r[0])&&Number.isFinite(+r[1])&&r[0]!==''&&r[1]!=='').map(r=>[+r[0],+r[1]]).sort((a,b)=>b[0]-a[0]);
  for(const [min,gpa] of g)if(p>=min)return gpa;return 0;
}
function calc(c){
  const cats={};
  [...THEORY,...LAB].forEach(([k,,, ,isList])=>{cats[k]=isList?listPct(c.items[k]):singlePct(c.items[k])});
  const norm=defs=>{let s=0,w=0,tot=0;defs.forEach(([k,,wt])=>{tot+=wt;if(cats[k]!=null){s+=cats[k]*wt;w+=wt}});return{pct:w?s/w:null,cov:100*w/tot}};
  const th=c.tch>0?norm(THEORY):{pct:null,cov:0},lb=c.lch>0?norm(LAB):{pct:null,cov:0};
  const ch=c.tch+c.lch;let s=0,w=0;
  if(c.tch>0&&th.pct!=null){s+=th.pct*c.tch;w+=c.tch}
  if(c.lch>0&&lb.pct!=null){s+=lb.pct*c.lch;w+=c.lch}
  const pct=w?s/w:null;
  const cov=ch?((c.tch>0?th.cov*c.tch:0)+(c.lch>0?lb.cov*c.lch:0))/ch:0;
  return{cats,th:th.pct,lab:lb.pct,pct,gpa:pct==null?null:gradeFor(pct),cov,ch};
}
function semester(){
  let qp=0,ch=0;
  state.courses.forEach(c=>{const r=calc(c);if(r.gpa!=null&&r.ch>0){qp+=r.gpa*r.ch;ch+=r.ch}});
  const sgpa=ch?qp/ch:null;
  const pc=Number(state.prevCH)||0,pg=Number(state.prevCgpa)||0;
  const cgpa=ch+pc>0&&sgpa!=null?(pg*pc+qp)/(pc+ch):null;
  return{sgpa,cgpa,ch,qp};
}
const fmtP=v=>v==null?'-':v.toFixed(1)+'%';
const fmtG=v=>v==null?'-':v.toFixed(2);
const ringColor=p=>p==null?'var(--accent)':p>=85?'var(--ok)':p>=70?'var(--accent)':p>=55?'var(--warn)':'var(--err)';

/* ---------- toasts & modal ---------- */
function toast(msg,type='info',ms=2800){
  const t=document.createElement('div');t.className='toast '+type;
  t.innerHTML=`<span>${{ok:'✅',warn:'⚠️',err:'⛔',info:'💬'}[type]}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),260)},ms);
}
function modal({title,msg='',html='',ok='OK',cancel='Cancel',danger=false,collect=null}){
  return new Promise(res=>{
    const m=$('#modal');
    m.innerHTML=`<div class="m-back"></div><div class="m-box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${msg?`<p>${esc(msg)}</p>`:''}${html}<div class="m-act">${cancel?`<button class="btn" data-m="no">${esc(cancel)}</button>`:''}<button class="btn ${danger?'danger-solid':'primary'}" data-m="ok">${esc(ok)}</button></div></div>`;
    m.classList.add('open');
    const first=m.querySelector('input');if(first)first.focus();
    const done=v=>{m.classList.remove('open');m.innerHTML='';document.removeEventListener('keydown',kd);m.onclick=null;res(v)};
    const submit=()=>{const v=collect?collect():true;if(v===undefined)return;done(v)};
    const kd=e=>{if(e.key==='Escape')done(null);else if(e.key==='Enter')submit()};
    document.addEventListener('keydown',kd);
    m.onclick=e=>{if(e.target.classList.contains('m-back')||e.target.dataset.m==='no')done(null);else if(e.target.dataset.m==='ok')submit()};
  });
}

/* ---------- voice commands ---------- */
const ONES={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19};
const TENS={twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
function wordsToDigits(s){
  const t=s.split(/\s+/),out=[];
  for(let i=0;i<t.length;i++){
    const w=t[i];
    if(w in TENS){let v=TENS[w];if(ONES[t[i+1]]!==undefined&&ONES[t[i+1]]<10)v+=ONES[t[++i]];out.push(v)}
    else if(w in ONES)out.push(ONES[w]);
    else if(w==='point'&&out.length){
      let d='';while(i+1<t.length&&(/^\d$/.test(t[i+1])||(ONES[t[i+1]]!==undefined&&ONES[t[i+1]]<10))){const n=t[++i];d+=/^\d$/.test(n)?n:ONES[n]}
      out.push(d?parseFloat(out.pop()+'.'+d):out.pop());
    }
    else if(w==='half'&&typeof out[out.length-1]==='number')out.push(out.pop()+0.5);
    else out.push(w);
  }
  return out.join(' ');
}
const undoStack=[];
function titleCase(s){return s.replace(/\b\w/g,c=>c.toUpperCase())}
function runCommand(raw){
  const nc=raw.trim().match(/^(?:new|add|create)\s+course\s+(.+)$/i);
  if(nc){const name=titleCase(nc[1].trim().replace(/[.]$/,''));createCourse(name,3,0);renderCourses();toast(`Added "${name}" (3 theory credits). Change credits above if needed.`,'ok',3800);return true}
  let t=raw.toLowerCase().replace(/[,!?]/g,' ').replace(/\b(out of|out off|over|upon|slash|divided by|by|off)\b/g,' / ').replace(/\//g,' / ');
  t=wordsToDigits(t.replace(/\s+/g,' ').trim());
  if(/\b(undo|remove last|delete last|cancel last)\b/.test(t))return doUndo();
  const nums=(t.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  if(!nums.length){
    const m=t.match(/(?:switch to|open|go to|select|course)\s+(.+)/);
    if(m)return switchCourse(m[1].trim());
    toast(`Could not find marks in "${raw}". Try "quiz 8 out of 10".`,'warn',3800);return false;
  }
  const lab=/\blab\b/.test(t);
  let key=null;
  if(/assign/.test(t))key=lab?'labAssignments':'assignments';
  else if(/quiz/.test(t)){if(lab){toast('Quizzes are theory only.','warn');return false}key='quizzes'}
  else if(/\bmid/.test(t))key=lab?'midLab':'mid';
  else if(/final|end ?term/.test(t))key=lab?'finalLab':'final';
  if(!key){toast('Which one is that? Say assignment, quiz, midterm or final first.','warn',3800);return false}
  const c=activeCourse();
  if(!c){toast('Add a course first, or say "new course database systems".','warn',4200);return false}
  if(lab&&c.lch<=0){toast(`${c.name} has no lab credits. Set lab credit hours first.`,'warn',3800);return false}
  const meta=META[key],o=nums[0],tot=nums.length>1?nums[1]:(meta.list?meta.def:(Number(c.items[key].t)||meta.def));
  if(!(tot>0)){toast('Total marks must be above zero.','warn');return false}
  if(o>tot){toast(`${o} is more than ${tot}. Check the total marks.`,'warn',4200);return false}
  const cap=meta.one.charAt(0).toUpperCase()+meta.one.slice(1);
  let fn;
  if(meta.list){
    const entry={o:String(o),t:String(tot)};c.items[key].push(entry);
    fn=()=>{const i=c.items[key].indexOf(entry);if(i>-1)c.items[key].splice(i,1)};
    toast(`${cap} ${c.items[key].length}: ${o}/${tot} added`,'ok');
  }else{
    const old={...c.items[key]};c.items[key]={o:String(o),t:String(tot)};
    fn=()=>{c.items[key]=old};
    toast(`${cap}: ${o}/${tot} saved`,'ok');
  }
  fn.cid=c.id;undoStack.push(fn);
  state.subtab=lab?'lab':'theory';save();renderCourses();return true;
}
function doUndo(){
  const fn=undoStack.pop();
  if(!fn){toast('Nothing to undo.','info');return false}
  fn();if(fn.cid&&state.courses.some(c=>c.id===fn.cid))state.active=fn.cid;save();renderCourses();toast('Last entry undone','ok');return true;
}
function switchCourse(q){
  const words=q.split(' ').filter(Boolean);
  let best=null,score=0;
  state.courses.forEach(c=>{
    const n=c.name.toLowerCase();let s=0;
    if(n===q)s=100;else if(n.includes(q))s=50;else words.forEach(w=>{if(w.length>2&&n.includes(w))s+=10});
    if(s>score){score=s;best=c}
  });
  if(!best){toast(`No course matches "${q}".`,'warn');return false}
  state.active=best.id;state.subtab='theory';save();renderCourses();toast(`Switched to ${best.name}`,'ok');return true;
}

/* speech engine */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
const LANGS=[{v:'en-US',l:'English (US)'},{v:'en-GB',l:'English (UK)'},{v:'en-IN',l:'English (India)'},{v:'en-PK',l:'English (PK)'}];
function renderLang(){$('#langDD').innerHTML=dd('lang',LANGS,state.lang,'up')}
ddHandlers.lang=v=>{state.lang=v;save();renderLang();if(listening){stopVoice();setTimeout(startVoice,300)}};
function setHeard(t,interim){const h=$('#heard');h.textContent=t?`"${t}"`:'';h.classList.toggle('interim',!!interim)}
function voiceUI(){
  $('#mic').classList.toggle('live',listening);
  $('#wave').classList.toggle('on',listening);
  $('#dstat').innerHTML=listening?'<b>Listening.</b> Say one entry at a time, e.g. "quiz 8 out of 10"':'Tap the mic and say: <b>"quiz 8 out of 10"</b>';
}
function startVoice(){
  if(!SR){toast('Voice input needs Chrome or Edge. You can still type commands below.','warn',5000);return}
  try{
    rec=new SR();rec.lang=state.lang;rec.continuous=true;rec.interimResults=true;
    rec.onresult=e=>{
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r=e.results[i],txt=r[0].transcript.trim();
        if(r.isFinal){setHeard(txt);runCommand(txt)}else setHeard(txt+' ...',true);
      }
    };
    rec.onerror=e=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;voiceUI();toast('Microphone blocked. Allow mic access (page must be on https or localhost).','err',5000)}
      else if(e.error==='network'){listening=false;voiceUI();toast('Speech service unreachable. Check your internet connection.','err',4500)}
    };
    rec.onend=()=>{if(listening){try{rec.start()}catch(_){listening=false;voiceUI()}}else voiceUI()};
    rec.start();listening=true;voiceUI();toast('Listening. Speak your marks.','info',2000);
  }catch(err){listening=false;voiceUI();toast('Could not start the microphone.','err')}
}
function stopVoice(){listening=false;try{rec&&rec.stop()}catch(_){}voiceUI()}
$('#mic').onclick=()=>listening?stopVoice():startVoice();
$('#undoBtn').onclick=doUndo;
$('#typer').onsubmit=e=>{e.preventDefault();const i=$('#cmd'),v=i.value.trim();if(!v)return;setHeard(v);if(runCommand(v))i.value=''};
$('#helpBtn').onclick=()=>modal({title:'Voice commands',ok:'Got it',cancel:null,html:`<ul class="help" style="padding-left:18px;margin:0">
<li><code>new course database systems</code> adds a course</li>

<li><code>undo</code> removes the last entry</li></ul><p style="margin:14px 0 0">Tip: speak one entry at a time and wait for the green confirmation. Voice works in Chrome or Edge over https or localhost.</p>`});
